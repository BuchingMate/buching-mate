name: test

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: buchingmate
          POSTGRES_PASSWORD: buchingmate_password123
          POSTGRES_DB: buching_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U buchingmate -d buching_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run server tests
        working-directory: apps/server
        # .env.test carries dummy auth/Stripe/Zoom values. DATABASE_URL is set
        # here to the Postgres service; test/setup.ts runs migrations.
        env:
          DATABASE_URL: postgresql://buchingmate:buchingmate_password123@localhost:5433/buching_test
        run: bun --env-file=.env.test test
