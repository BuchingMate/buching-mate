name: deploy

on:
  push:
    branches: [main, development]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: buchingmate/buching-mate-server
  WEB_IMAGE: buchingmate/buching-mate-web

jobs:
  # ----------------------------------------------------------------------
  # Cloud deploy: triggered by pushes to main / development.
  # Builds server image with moving tag (production / staging) + sha tag,
  # then pings Coolify webhook. Web app deploys to Cloudflare Workers.
  # ----------------------------------------------------------------------
  cloud-meta:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set.outputs.env_name }}
      image_tag: ${{ steps.set.outputs.image_tag }}
    steps:
      - id: set
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_name=production" >> "$GITHUB_OUTPUT"
            echo "image_tag=production" >> "$GITHUB_OUTPUT"
          else
            echo "env_name=staging" >> "$GITHUB_OUTPUT"
            echo "image_tag=staging" >> "$GITHUB_OUTPUT"
          fi

  cloud-server:
    needs: cloud-meta
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}
          tags: |
            type=raw,value=${{ needs.cloud-meta.outputs.image_tag }}
            type=sha,prefix=${{ needs.cloud-meta.outputs.image_tag }}-,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ needs.cloud-meta.outputs.image_tag }}-${{ github.sha }}
          cache-from: type=gha,scope=server-${{ needs.cloud-meta.outputs.env_name }}
          cache-to: type=gha,scope=server-${{ needs.cloud-meta.outputs.env_name }},mode=max

      - name: Trigger Coolify redeploy
        env:
          WEBHOOK: ${{ needs.cloud-meta.outputs.env_name == 'production' && secrets.COOLIFY_WEBHOOK_URL_PROD || secrets.COOLIFY_WEBHOOK_URL_STAGING }}
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -n "$WEBHOOK" ] && [ -n "$TOKEN" ]; then
            echo "Triggering Coolify redeploy for ${{ needs.cloud-meta.outputs.env_name }}"
            curl -fsSL -X GET -H "Authorization: Bearer $TOKEN" "$WEBHOOK"
          else
            echo "Missing COOLIFY_WEBHOOK_URL or COOLIFY_API_TOKEN — skipping (Coolify will pull on its own poll cycle)"
          fi

  cloud-web:
    needs: cloud-meta
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Build web for Cloudflare
        working-directory: apps/web
        run: bun run build:cf

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ needs.cloud-meta.outputs.env_name }}" = "production" ]; then
            bunx wrangler deploy
          else
            bunx wrangler deploy --env staging
          fi

  # ----------------------------------------------------------------------
  # Self-host release: triggered by git tags `v*`.
  # Builds both server + web images, pushes with version tag + `latest`.
  # Self-hosters pull these via docker-compose.
  # ----------------------------------------------------------------------
  release-images:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: server
            image: buchingmate/buching-mate-server
            dockerfile: apps/server/Dockerfile
          - name: web
            image: buchingmate/buching-mate-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,scope=release-${{ matrix.name }},mode=max
