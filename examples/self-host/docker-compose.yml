# Buching Mate — self-host deployment
#
# Usage:
#   1. Copy .env.example to .env and fill in values
#   2. docker compose pull
#   3. docker compose up -d
#   4. Visit http://localhost:5678
#
# Update later:
#   docker compose pull && docker compose up -d
#
# All three services run on one host. Postgres data persists in the `db-data` volume.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/buchingmate/buching-mate-server:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      WEB_URL: ${WEB_URL}
      PUBLIC_HOST_ALLOWLIST: ${PUBLIC_HOST_ALLOWLIST}
      PLATFORM_HOST_SUFFIXES: ${PLATFORM_HOST_SUFFIXES}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      BUSINESS_NAME: ${BUSINESS_NAME}
      BUSINESS_SLUG: ${BUSINESS_SLUG}
      NODE_ENV: production
      # Leave DEPLOYMENT_MODE unset for self-host (defaults to self-hosted)
    ports:
      - "${SERVER_PORT:-3456}:3456"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3456/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/buchingmate/buching-mate-web:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_SERVER_URL: ${VITE_SERVER_URL}
      VITE_BUSINESS_NAME: ${BUSINESS_NAME}
      VITE_BUSINESS_SLUG: ${BUSINESS_SLUG}
    ports:
      - "${WEB_PORT:-5678}:5678"

volumes:
  db-data:
